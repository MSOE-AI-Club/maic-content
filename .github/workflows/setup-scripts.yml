name: Setup scripts

# Runs the member setup scripts on fresh GitHub runners in non-interactive mode.
# The runners cannot reach Rosie or open a browser, so the VPN, Rosie, and GitHub
# steps are skipped. Every other step must finish and the check must show no [X]
# except GlobalProtect.

on:
  push:
    branches: [main]
    paths: ['setup/**', '.github/workflows/setup-scripts.yml']
  pull_request:
    paths: ['setup/**', '.github/workflows/setup-scripts.yml']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -S warning -s bash setup/mac.sh
      - name: Run setup (non-interactive)
        env:
          MAIC_SETUP_YES: '1'
          MAIC_SETUP_USER: ci-test
        run: bash setup/mac.sh
      - name: Check
        env:
          MAIC_SETUP_CHECK: '1'
        run: |
          set +e
          bash setup/mac.sh | tee check.txt
          set -e
          if grep -E '^\s*\[X\]' check.txt | grep -v GlobalProtect | grep -v 'required tools are missing'; then
            echo 'A required tool is missing after setup.'; exit 1
          fi
          grep -q 'maic env' check.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run setup (non-interactive)
        # Windows PowerShell 5.1, the one members have. Same path as `irm | iex`.
        shell: powershell
        env:
          MAIC_SETUP_YES: '1'
          MAIC_SETUP_USER: ci-test
        run: Get-Content -Raw .\setup\windows.ps1 | Invoke-Expression
      - name: Check
        shell: powershell
        env:
          MAIC_SETUP_CHECK: '1'
        run: |
          # The script prints with Write-Host (stream 6). Redirect it, or $out is empty.
          $out = Get-Content -Raw .\setup\windows.ps1 | Invoke-Expression 6>&1 | Out-String
          Write-Host $out
          $bad = ($out -split "`n") | Where-Object { $_ -match '^\s*\[X\]' -and $_ -notmatch 'GlobalProtect' -and $_ -notmatch 'required tools are missing' }
          if ($bad) { Write-Host 'A required tool is missing after setup.'; exit 1 }
          if ($out -notmatch 'maic env') { exit 1 }
